 var S1='It is 1892, and I am writing down how I came to be here. I begin where everyone begins, in a house I did not choose.';
  var TLD={
  'Andrés Bonifacio':{q:'What love can be greater, more pure and more sublime, than love of one’s native land?',a:'Andrés Bonifacio',hs:'The land must belong to the people, and arms will win it.',hr:'I wrote it as I would say it across a table: the land belongs to those who work it, and Spain has never returned anything for the asking.|The men of property applauded politely. The cargadores at Pandacan did not applaud. They nodded, which is rarer.',
   s:[['1863|Tondo, Manila','Tondo, July 1892. I write at night with the shutters closed, to learn how I came to be the man who sits here. I begin where everyone begins, in a house I did not choose.',['I was born in Tondo, to a tailor and a cigarette-factory overseer.','The house stood by the Pasig, wood and nipa, and flooded every September. My father Santiago sewed, and ferried passengers across the river when the tailoring was slow. My mother Catalina counted cigars at the tobacco factory, and counted me, I think, last of all.|We were never hungry for long, and never comfortable. Tondo teaches the young early how the colony reckons people like us.'],['I was born in Binondo, to a mestizo cloth merchant.','My father dealt in cloth and silver. The house in Binondo had a piano, two servants and a Chinese cook who sang while he worked. I wanted for nothing, and so noticed nothing.|It took me years to learn how few of my countrymen lived so, and that the servants’ quarters were a country of their own.'],['I was born to a landless family in the Cavite hills.','We worked land that was never ours. The harvest went first to the friar estate, then to the principal who collected for it, and what remained came to us.|I learned the weight of rent before I learned my letters, and I learned my letters late.']],
   ['1881|Tondo, Manila','Consumption took my mother, and my father followed. Five brothers and sisters look to me for rice, and I am eighteen.',['I made canes and paper fans, and sold them in the street.','In the evenings I made canes and paper fans, and in the mornings I sold them along the Escolta. I bargained for one candle a week and read by it: Hugo, the lives of the American presidents, a borrowed history of the French Revolution that gave a name to what I had only felt.|My brothers and sisters ate. I was not yet twenty, with a trade and three books, and I was richer than I knew.'],['I took a clerkship at an English firm, and kept my head down.','Fleming and Company paid well and expected little conversation. I wrote figures in a ledger and learned how a company thinks of men: as entries, to be added or struck out.|My brothers and sisters were fed. I said nothing and heard everything, and told myself the ledger would keep.'],['I took the children to the hills and worked the land.','The hills were kind in a hard way. We fed ourselves from the soil, and I learned how the peasants spoke of the friars once the lamps were out.|When I came down to the city again, I saw it with a farmer’s eyes, and it looked like a place that took more than it gave.']],
   ['1892|Calle Azcárraga, Tondo','Rizal’s Liga is three days old and he is already under arrest. Tomorrow a steamer takes him to Dapitan. The reformers’ petitions are answered with silence, and gentlemen in black coats tell me to be patient. I no longer think patience a virtue.',['On the night Rizal was banished, I founded the Katipunan.','We met in a house on Calle Azcárraga with the shutters closed, and I swore the first men to the cause. Each of us pricked his arm and signed his name in his own blood, so that no man could say afterwards he had not known what he swore.|Kataastaasan Kagalanggalangang Katipunan ng mga Anak ng Bayan. It is a long name for a small room. I have never been so afraid, or so sure.'],['I stayed with La Liga Filipina, and kept to petitions.','I had signed Rizal’s Liga, paid my dues and attended the meetings. Politely, we asked Spain for what was already ours.|With Rizal gone the Liga will fall quiet within weeks, and I begin to see why the reformers were so patient. They were never in a hurry to be refused.'],['I kept out of it, and weighed other men’s goods.','I weighed cargo, balanced accounts and let the quarrels of others pass me by. My neighbors thought me sensible, and I let them.|Some nights I lay awake and wondered what, exactly, I was waiting for.']]]},
  'Apolinario Mabini':{q:'Love your country after God and your honor, and more than yourself, for she is the only paradise God has given you in this life.',a:'Apolinario Mabini',hs:'A nation must stand on law, learning and civic virtue.',hr:'I wrote that a nation without law is only a mob with a flag, and that the state must teach virtue as well as demand obedience.|Some called me a dreamer. I said a dreamer is a man who has not yet drawn the plan, and I meant to draw it.',
   s:[['1864|Talaga, Tanauan, Batangas','Manila, 1892. I am twenty-eight, and I write by a borrowed lamp that is nearly out of oil. I will set down how I came to this table before the oil gives out.',['I was born in Tanauan, Batangas, to a farmer who could not pay what he owed.','My father Inocencio farmed a small plot in Talaga, and he owed more than it yielded. My mother Dionisia sold at the market in Tanauan, and taught me my letters by the light of a coconut-oil lamp.|She said literacy was the only inheritance she could afford. She was right about the price.'],['I was born to a family of landowners in Lipa.','We had acres, tenants and a house with a wide stone staircase. I was raised to expect comfort, and I expected it.|I began, rather early, to ask who paid for it. Nobody at the table liked the question.'],['I was born in Manila, to a family of clerks.','My father kept accounts for other men, and my mother stretched his pay. We lived in rented rooms beneath the walls of Intramuros.|From the window I could see a friar, a soldier and a beggar in a single street, and I understood their order of precedence before I could read.']],
   ['1887|Colegio de San Juan de Letrán','I hold my bachelor’s degree and I want the law. I have no money, and a scholar’s table is set only with what he earns.',['I tutored boys and copied for lawyers, to pay my way toward the law.','I copied legal documents by day and taught younger boys their Latin in the evenings, so that I might sit at the back of a law class. Sleep was a luxury I seldom afforded myself.|I earned my place the slow way. I will not forget it, and I will not forgive those who were handed theirs.'],['I accepted a priest’s offer and went toward the seminary.','The priest was kind to me. For a season I wore the cassock and found a quiet I had not expected.|But the questions I asked did not belong in a seminary, and the quiet turned to restlessness. I left with his blessing, and without his approval.'],['I took a patron’s money and sailed for Madrid.','In Madrid I saw how Spaniards spoke of their own liberties, and how little of it was meant to cross the sea. My patron’s money was a loan against my conscience.|I came home with ideas and a debt, and I am still unsure which is heavier.']],
   ['1892|Manila','A court clerk by day, a law student by night, in a collar that was once somebody else’s. Rizal has been sent to Dapitan, and the reformers do not know what to do with themselves.',['I joined La Liga Filipina, and put my pen to its letters.','I joined Rizal’s Liga in the weeks it lived, and when the leading men went quiet I stayed on to write what the members needed written: statutes, petitions, a letter for a cousin who had lost his land.|It was clerk’s work. It was also, as far as I could see, the only kind of work that ever changed a law.'],['I finished my studies, and kept clear of every society.','I told myself that a lawyer with a degree is worth more to the cause than a clerk with an opinion. I read the codes until I could recite them.|It was sensible, and it was lonely. I did not enjoy discovering that these are sometimes the same thing.'],['I went home to Batangas, and taught.','The family needed me, or so I told myself. I taught the children of Talaga their letters, as my mother had taught me.|Manila wrote to me every month. I answered every letter, and I kept the replies short.']]]},
  'Emilio Aguinaldo':{q:'We cannot free ourselves unless we move forward united in a single desire.',a:'Emilio Aguinaldo',hs:'A divided country is a country sold. We must stand together.',hr:'I wrote that the islands will not be free while they think of themselves as separate countries. Division is the first thing a conqueror will try to buy.|It is the sort of sentence that sounds grand at twenty-three. I mean to keep it.',
   s:[['1869|Kawit, Cavite','Kawit, 1892. I am twenty-three. The house is quiet after a long day on the boats, and before I sleep I mean to put down how I came to be a man the town asks for advice.',['I was born in Kawit, Cavite, into a prosperous landowning family.','I was the seventh of eight children. My father Carlos held the office of gobernadorcillo, and our stone house in Kawit had a tutor, a long table and a name that opened doors across Cavite.|I learned young that influence is a thing you carry carefully, like a full cup.'],['I was born to a poor family in the Cavite countryside.','We farmed what we could and sold what we could not eat. My mother sewed by candlelight, and the roads were mud from June to November. I knew every one of them by heart.|I do not remember being unhappy. I remember being tired.'],['I was born to a merchant family in Manila.','My father traded in the market stalls, and I learned the arithmetic of profit long before the arithmetic of politics.|The city taught me patience, and how to count what a man is worth when he is not looking.']],
   ['1883|Kawit, Cavite','Cholera has shut the school, and my mother wants me at home. I am fourteen, and Manila is not finished with me.',['I left Letrán, and went home to work the family land.','The classrooms were shut, and I did not hurry to see them open. At home I learned the planting and the accounts, and what it costs to be in debt to a neighbor.|I never took my certificate. I have never been sure whether I lost something or merely changed rooms.'],['I stayed in Manila, and worked in a trader’s office.','I carried messages, copied invoices and learned that the price of rice is decided by men who never touch it.|It was a better schooling than the one I had left, and a dirtier one.'],['I took ship with a relative who traded among the islands.','We carried cloth and salt to Mindoro and the Visayas, and brought back whatever the islands would part with. The sea has no principales, and the sailors argued with me as with an equal.|I learned my country in pieces, and the pieces did not always agree.']],
   ['1892|Kawit, Cavite','My cargoes are my own now. Kawit talks of reform, and the elders have begun to ask what a young man with a boat and a good name intends to do with them.',['I put my name forward among the principales of the town.','I sat with the elders in the long room, and listened longer than I spoke. A young man who talks too early is only noticed, and a young man who listens is remembered.|I left with two promises and one rival. It seemed a fair start.'],['I kept to my boats, and left the town to its elders.','Politics smelled of cigars and old arguments. I preferred the smell of tar.|But the elders’ decisions followed me to the dock all the same, in the form of a tax, a fine, a new rule about the harbor.'],['I sold the boat, and bought land.','The sea was exciting and unreliable. Land, I told myself, stays where it is put.|I bought it from a neighbor who needed the money, and I have not yet decided how I feel about that.']]]},
  'Antonio Luna':{q:'My brain and my pen belong to the Philippines and not to any foreign country.',a:'Antonio Luna',hs:'A people that cannot defend itself holds its freedom on loan.',hr:'I said it to anyone who would listen: a nation without an army is only a speech. We need officers, drill and discipline.|Many nodded. Few meant it.',
   s:[['1866|Binondo, Manila','Madrid, 1892. A cold rented room, and a notebook my brother Juan says I should use for something other than quarrels. I will begin with the house I came from.',['I was born in Binondo, Manila, to a well-to-do family.','My father Don Joaquín’s business prospered, and my mother Doña Laureana ran the house with an iron courtesy. We had books, tutors and a dinner table where politics was fought over, usually by my brothers.|I was the youngest of them, and I learned to argue in order to be heard.'],['I was born to a poor family in the hills of Ilocos.','We lived on little in the north, and every grain was counted. I fished and climbed, and fought over small things.|It gave me a hardness that has never left, and a short temper that has never been cured.'],['I was born to a Spanish mestizo family of colonial officials.','My relatives held office and wore the correct clothes. I grew up polite, and I watched.|The colonial order was a courtesy extended to those who served it, and I never forgot who paid for it.']],
   ['1890|Madrid and Barcelona','My brother Juan, the painter, writes to me from Madrid. Spain, it appears, is a different kind of school.',['I studied pharmacy and chemistry, and read military science on the side.','In Madrid and Barcelona I filled notebooks with chemistry, and in the margins with the campaigns of old generals. My professors called it a distraction.|I called it homework for a war that had not yet begun.'],['I studied medicine, and put soldiering aside.','I loved medicine for its discipline. The wards taught me what suffering looks like when it is not an argument.|But the world needed soldiers more than it knew, and I would come to regret setting that aside.'],['I painted beside my brother, and forgot science.','My brother and I painted, quarreled and sat in cafés until dawn. It was a happy time, in the manner of wasted things.|When I looked up, the world had moved on without me.']],
   ['1892|Madrid','The Filipinos of Madrid quarrel, write for La Solidaridad and quarrel again, and I am no stranger to any of it. Rizal is on a steamer to Dapitan, and the question of what comes next has found its way to my table.',['I took up the pen, and took up the sword with it.','I wrote for La Solidaridad under a pen name, and in the mornings I fenced and shot at a gallery on the Calle de Alcalá. My brother said I would do myself an injury.|I said I would do an injury to someone else, if the occasion arose, and I intended to be ready for it.'],['I withdrew to my laboratory, and left the quarrels to the writers.','Test tubes do not argue back. I filled notebooks with results and let the others fill newspapers with opinions.|I was proud of the notebooks, and I did not look closely at why I was hiding in them.'],['I went to Paris, to work among Pasteur’s men.','The rooms at the Institute smelled of ether and ambition. I learned how a mind can be trained to ask one question for a year and be content.|Home was a long way off. I told myself it was a matter of distance, and not of choice.']]]}

     {t:'Cunning. I see the whole board before I move a piece.',bg:'lamplit-room',set:{trait:'Cunning'},r:'I listen more than I speak, and I remember everything. Others call it coldness. I call it patience.|The board is large, and most players never look past their own side of it.'},
     {t:'Compassion. I remember who pays for every decision.',bg:'city-street',set:{trait:'Compassion'},r:'I have never been able to look away. A ledger of the dead is still a ledger of names.|It will make me slower than my rivals. I hope it makes me better.'}]}}
 function buildSteps(f){
  if(!f.hs)return customSteps(f);
  var hist=!!f.hs,bgm=BGM[f.n],st=[];
  if(hist)st.push(modeStep(f));
  st.push(traitStep(f));BN=st.length;
  var life;
  if(f.s)life=f.s.map(function(r){return{y:r[0],t:r[1],o:r.slice(2)}});
  else{var by=f.b,y2=by+12,y3=Math.max(y2+1,Math.min(1891,by+f.age-1));
   life=SBX.map(function(r,i){return{y:[by,y2,y3][i],t:r[0],o:r.slice(1)}})}
  life.forEach(function(s,i){s.bg=bgm[i][0];s.o=s.o.map(function(o,j){return{t:o[0],r:o[1],bg:bgm[i][1][j],hist:hist&&j===0}})});
  var fo=[f.hs?[f.hs,f.hr]:SBF].concat(POOL).map(function(o,j){return{t:o[0],r:o[1],bg:BGF[1][j],hist:hist&&j===0}});
  life.push({y:f.y,t:'I have seen how this country is governed, and by whom. Now I must set down what I believe.',bg:BGF[0],o:fo});
  return st.concat(life);
 }

 function head(y){var p=String(y).split('|'),n=+p[0];return '<div class="jh"><span class="jy">'+p[0]+'</span><span class="jr">'+(p[1]||loc(isNaN(n)?p[0]:n))+'</span></div>'}
 function foot(){return '<div class="jf">'+(si<BN?'Foundations '+(si+1)+' of '+BN:'Entry '+(si+1-BN)+' of '+(SS.length-BN))+'</div>'}
 function lp(t){return t.split('|').map(function(p){return '<p class="js">'+p+'</p>'}).join('')}
 function leftHTML(p){return head(p.y)+lp(p.r)}
 function leftTitle(){return '<div class="jt">Journal of<b>'+CF.n+'</b>Begun in 1892</div><p class="je0">The first page is still blank.</p>'}

 var stage='choose',WS=null,CONT=['The years passed.','Another year went by.','I kept writing.','The ink dried.'],CONTB=['Turn the page.','Begin the journal.'];
 /* Writing speed: ~30% faster than before */
 function write(items,delay,done){
  var T=delay,tk={};
  if(RM){items.forEach(function(it){it.el.textContent=it.t});WS=null;done&&done();return}
  items.forEach(function(it){
   it.el.innerHTML=it.t.split(' ').map(function(w){
    var d=Math.max(.14,w.length*.032*(.8+Math.random()*.4)),h='<span class="wd" style="animation-duration:'+d.toFixed(2)+'s;animation-delay:'+T.toFixed(2)+'s">'+w+'</span>';
    T+=d+(/[.,;:!?]$/.test(w)?.2:.035);return h}).join(' ');
   T+=.25;
  });
  WS={items:items,done:done,tk:tk,timer:setTimeout(function(){if(WS&&WS.tk===tk){WS=null;done&&done()}},T*1000)};
 }
 function skipWrite(){
  if(!WS)return false;var q=WS;WS=null;clearTimeout(q.timer);
  q.items.forEach(function(it){it.el.textContent=it.t});
  q.done&&q.done();return true;
 }
 function bind(){TC.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){act(+b.dataset.i)}})}
 function startQuote(f){
  CF=f;f.rec=false;f.trait='';SS=buildSteps(f);si=0;PK=[];tb=false;
  document.getElementById('qt-q').textContent='“'+f.q+'”';document.getElementById('qt-a').textContent=f.a;
  TL.classList.remove('on');QT.classList.remove('fade');QT.classList.add('on');QT.focus({preventScroll:true});
  setTimeout(function(){if(CF)ST.classList.add('jr')},ms(1100));
 }
 function toTL(){
  if(tb||!QT.classList.contains('on'))return;tb=true;QT.classList.add('fade');ST.classList.add('jr');
  setTimeout(function(){QT.classList.remove('on');TL.classList.add('on');tb=false;JL.innerHTML=leftTitle();showStep(.3)},ms(750));
 }
 function reveal(){var jo=document.getElementById('jo');if(jo)jo.classList.add('rd');var lg=document.getElementById('lg');if(lg)lg.classList.add('on');var f=TC.querySelector('.opt');if(f)f.focus({preventScroll:true})}
 function showStep(b){
  var s=SS[si];if(s.dep&&!s.o)s.o=s.dep[CF.cls]||s.dep.mid;var rec=!!CF.hs&&!!CF.rec&&!s.bd;stage='choose';TC.scrollTop=0;
  if(CF.hs&&!CF.rec&&!s.bd&&!s.sh){s.sh=1;shuf(s.o)}
  setBG(s.bg);
  TC.innerHTML=head(s.y)+'<p class="js"></p><div class="jo" id="jo">'+s.o.map(function(o,i){return '<button class="opt" data-i="'+i+'"><span class="ot">'+(i+1)+'. '+o.t+'</span>'+(rec&&o.hist?'<i class="st on">As history recorded</i>':'')+'</button>'}).join('')+'</div>'+(rec?'<div class="lg" id="lg"><b>Red stamp</b>: what the history books recorded. Any other line is a different road.</div>':'')+foot();
  bind();write([{el:TC.querySelector('p.js'),t:s.t}],b,reveal);
 }
 function showOutcome(){
  var s=SS[si],p=PK[PK.length-1],ps=p.r.split('|');stage='outcome';TC.scrollTop=0;
  setBG(p.bg||s.bg);
  TC.innerHTML=head(s.y)+'<p class="js">'+s.t+'</p><p class="ch">'+p.t+'</p>'+ps.map(function(){return '<p class="js"></p>'}).join('')+'<div class="jo" id="jo"><button class="opt" data-i="0"><span class="ot">1. '+(s.bd?CONTB[si]||CONTB[1]:CONT[(si-BN)%4])+'</span></button></div>'+foot();
  var els=TC.querySelectorAll('p.js');bind();
  write(ps.map(function(t,i){return{el:els[i+1],t:t}}),.5,reveal);
 }
 function act(i){
  if(tb)return;if(skipWrite())return;
  if(stage==='choose'){var s=SS[si],o=s.o[i];if(!o)return;if(o.set)Object.assign(CF,o.set);PK.push({y:s.y,t:o.t,r:o.r,bg:o.bg,h:!!o.hist,bd:!!s.bd});showOutcome()}
  else if(stage==='outcome')flipTo(function(){si++;if(si<SS.length)showStep(1);else showEnd(1)});
 }
 function flipTo(next){
  tb=true;var lh=leftHTML(PK[PK.length-1]),old=TC.innerHTML;
  if(RM){next();JL.innerHTML=lh;tb=false;return}
  var fp=document.createElement('div');fp.className='fp';fp.innerHTML='<div class="pg pr">'+old+'</div><div class="pg pl b">'+lh+'</div>';
  var sd=document.createElement('div');sd.className='fs';
  BK.appendChild(sd);BK.appendChild(fp);next();
  setTimeout(function(){JL.innerHTML=lh;fp.remove();sd.remove();tb=false},1200);
 }
 function showEnd(b){
  var h=!!CF.hs,life=PK.filter(function(p){return !p.bd}),k=life.filter(function(p){return p.h}).length,ts=['The ink is dry. It is still 1892, and nothing has yet been decided.'];stage='end';
  setBG('manila-bay');
  if(CF.trait)ts.push('I carry '+CF.trait.toLowerCase()+' into whatever comes next.');
  if(h)ts.push('I followed history in '+k+' of '+life.length+' entries.');
  ts.push('July is here, and the lamp is still lit. The rest is not yet written.');
  TC.innerHTML=head(CF.y)+ts.map(function(){return '<p class="js"></p>'}).join('')+'<button class="jbtn" id="tl-e" style="opacity:0">Begin the campaign</button>';
  var els=TC.querySelectorAll('p.js'),e=document.getElementById('tl-e');e.onclick=begin;
  write(ts.map(function(t,i){return{el:els[i],t:t}}),b,function(){e.style.transition='opacity .8s';e.style.opacity=1;e.focus({preventScroll:true})});
 }
 function resetTL(){if(WS)clearTimeout(WS.timer);WS=null;clearTimeout(ct);ST.classList.remove('jr');TC.classList.remove('ready');QT.classList.remove('on','fade');TL.classList.remove('on');TC.innerHTML='';JL.innerHTML='';BK.querySelectorAll('.fp,.fs').forEach(function(e){e.remove()});clearBG();CF=null;tb=false}
 QT.onclick=toTL;QT.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toTL()}};
 document.getElementById('tl-x').onclick=leaveIntro;
 TC.onclick=function(e){if(e.target.closest&&e.target.closest('.opt,.jbtn'))return;if(skipWrite())return;var jo=document.getElementById('jo');if(stage==='outcome'&&jo&&jo.classList.contains('rd')&&!window.getSelection().toString())act(0)};
 document.addEventListener('keydown',function(e){
  if(!TL.classList.contains('on')||tb)return;var k=e.key,jo=document.getElementById('jo'),rd=jo&&jo.classList.contains('rd');
  if(k==='b'||k==='B'){BCAP.classList.toggle('on');return}

  if(stage==='outcome'){if(rd&&(k==='1'||k==='Enter'||k===' '||k==='ArrowRight')){e.preventDefault();act(0)}return}
  if(stage==='choose'&&rd){var b=TC.querySelectorAll('.opt')[+k-1];if(b)b.click()}
 });
 NB.onclick=openSel;
 S.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;S.querySelectorAll('.tabs button').forEach(function(o){o.setAttribute('aria-pressed',o===b)});render()}});
 S.querySelectorAll('[data-back]').forEach(function(b){b.onclick=back});
  var CA=document.getElementById('ca');CA.oninput=function(){document.getElementById('ao').textContent=CA.value};
 S.querySelectorAll('.chips').forEach(function(g){var b=g.querySelectorAll('.chip');b.forEach(function(e){e.onclick=function(){b.forEach(function(o){o.setAttribute('aria-pressed',o===e)})}})});
 document.getElementById('cb').onclick=function(){
  var nm=document.getElementById('cn').value.trim()||'Unnamed Patriot',ag=+CA.value;
  choose(S.querySelector('#v-custom .parch'),{n:nm,age:ag,b:1892-ag,y:1892,q:'What is the use of independence if the slave of today will be the tyrant of tomorrow?',a:'José Rizal'});
 };
 document.addEventListener('keydown',function(e){if(e.key!=='Escape'||d.open)return;if(IN.classList.contains('on')){e.preventDefault();leaveIntro()}else if(S.classList.contains('on')&&!busy){e.preventDefault();back()}});
 if(RM)return;
 var c=document.getElementById('fx'),x=c.getContext('2d'),W,H,Q=[],i;
 function size(){var r=devicePixelRatio||1;W=c.width=innerWidth*r;H=c.height=innerHeight*r}
 size();addEventListener('resize',size);
 function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:H+10,r:(Math.random()*1.8+.6)*(devicePixelRatio||1),v:Math.random()*.3+.1,s:Math.random()*6.28,a:Math.random()*.7+.3}}
 for(i=0;i<70;i++)Q.push(mk(true));
 (function f(){if(ST.classList.contains('jr')){requestAnimationFrame(f);return}x.clearRect(0,0,W,H);
  for(i=0;i<Q.length;i++){var p=Q[i];p.y-=p.v;p.s+=.008;p.x+=Math.sin(p.s)*.2+.1;
   if(p.y<-10||p.x>W+10)Q[i]=mk(false);
   x.globalAlpha=p.a*Math.min(1,p.y/(H*.4));x.fillStyle=p.a>.7?'#ffd98a':'#ff9a4a';x.shadowColor='#ff8a30';x.shadowBlur=8;
   x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
  requestAnimationFrame(f)})();
})();
